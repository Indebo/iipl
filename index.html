<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Indebo</title>
<meta name="description" content="Indebo — independent, indelible. Based in India since 1979.">

<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/favicon-180.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Work+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
  :root{
    --paper: #EDEAE1;
    --ink: #212B30;
    --ink-soft: #4B565B;
    --madder: #7C332A;
    --madder-soft: #A85B4C;
    --turmeric: #B5872C;
    --indigo: #2D4356;
    --line: rgba(33,43,48,0.16);
  }

  *{
    box-sizing: border-box;
  }

  body{
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Work Sans', sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  a{
    color: inherit;
  }

  ::selection{
    background: var(--madder);
    color: var(--paper);
  }

  :focus-visible{
    outline: 2px solid var(--madder);
    outline-offset: 5px;
  }

  main{
    min-height: 100vh;
    max-width: 760px;
    margin: 0 auto;
    padding: 56px 32px 48px;
    display: flex;
    flex-direction: column;
  }

  /* The quiet mark at the top */

  .dyemark{
    margin-bottom: 24px;
  }

  .dyemark svg{
    width: 66px;
    height: 40px;
    display: block;
  }

  .wordmark{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin: 0;
  }

  /* The Door */

  .door{
    margin: auto 0;
    padding: 10vh 0 12vh;
  }

  .door-link{
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 32px;

    color: var(--ink);
    text-decoration: none;

    font-family: 'Fraunces', serif;
    font-weight: 400;
    font-size: clamp(32px, 5vw, 54px);
    line-height: 1.08;
    letter-spacing: -0.02em;

    padding: 0 0 14px;
    border-bottom: 1px solid var(--line);

    transition:
      color 0.15s ease,
      border-color 0.15s ease;
  }

  .door-link + .door-link{
    margin-top: 34px;
  }

  .door-link:first-child{
    color: var(--madder);
  }

  .door-link:hover{
    border-bottom-color: var(--ink-soft);
  }

  .door-link:first-child:hover{
    color: var(--ink);
  }

  .door-arrow{
    flex: 0 0 auto;
    font-family: 'Work Sans', sans-serif;
    font-size: 0.5em;
    font-weight: 300;
    color: var(--ink-soft);

    transition: transform 0.15s ease;
  }

  .door-link:hover .door-arrow,
  .door-link:focus-visible .door-arrow{
    transform: translateX(5px);
  }

  /* Quiet corporate layer */

  footer{
    padding-top: 20px;
    border-top: 1px solid var(--line);
  }

  footer p{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    line-height: 1.7;
    color: var(--ink-soft);
    margin: 0;
  }

  footer a{
    color: var(--ink-soft);
    text-decoration: none;
    border-bottom: 1px dashed var(--line);
  }

  footer a:hover{
    color: var(--ink);
    border-bottom-style: solid;
  }

  /* Mobile */

  @media (max-width: 600px){

    main{
      padding: 32px 20px 28px;
    }

    .door{
      padding: 8vh 0 10vh;
    }

    .door-link{
      font-size: clamp(30px, 9vw, 42px);
      line-height: 1.1;
      gap: 18px;
      padding-bottom: 12px;
    }

    .door-link + .door-link{
      margin-top: 28px;
    }

    footer p{
      font-size: 10px;
    }
  }
</style>
</head>

<body>

<main>

  <header>
    <div class="dyemark" aria-hidden="true">
      <svg viewBox="0 0 66 40" xmlns="http://www.w3.org/2000/svg">
        <circle cx="18" cy="20" r="16" fill="var(--indigo)" opacity="0.85"/>
        <circle cx="33" cy="20" r="16" fill="var(--madder)" opacity="0.85"/>
        <circle cx="48" cy="20" r="16" fill="var(--turmeric)" opacity="0.85"/>
      </svg>
    </div>

    <p class="wordmark">Indebo</p>
  </header>


  <nav class="door" aria-label="Enter Indebo">

    <a class="door-link" href="india.html">
      <span>India on your mind?</span>
      <span class="door-arrow" aria-hidden="true">→</span>
    </a>

    <a class="door-link" href="conversation.html">
      <span>Ready to start a conversation?</span>
      <span class="door-arrow" aria-hidden="true">→</span>
    </a>

  </nav>


  <footer>
    <p>
      Indebo (India) Pvt Ltd &amp; Indebo Travels Pvt Ltd ·
      <a href="mailto:india@indebo.com">india@indebo.com</a> ·
      <a href="corporate.html">Company</a>
    </p>
  </footer>

</main>

</body>
</html>
